<title>Rachel &amp; Xavier Wedding HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Mono:wght@400&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: fixed glass chrome over a redwoods photo; main column beside a 284px sticky widget rail,
   collapsing to one column under 860px. Dashboard drops the rail and runs full width. */
:root{
  color-scheme:dark;
  --page:#0D1610;
  --page-grad:linear-gradient(150deg,#0E1C14 0%,#17201A 55%,#261B12 100%);
  --scrim:linear-gradient(180deg,rgba(8,13,9,.64) 0%,rgba(8,13,9,.76) 100%);
  --chrome:rgba(9,15,10,.58);
  --ink:#F2F0E6;
  --ink-soft:rgba(242,240,230,.78);
  --white:#FFFFFF;
  --mute:#BDBCA6;
  --mute-faint:rgba(189,188,166,.6);
  --fog:#A3C6D6;          /* Xavier: morning fog in the canopy */
  --rose:#EEA79C;         /* Rachel: redwood-bark rose */
  --fern:#AFD38E;         /* Both: sword fern */
  --gold:#F2C46D;         /* highlights: the sunbeam */
  --lichen:#D7CBA2;       /* labels: sunlit bark */
  --alert:#FF9C86;
  --glass:rgba(255,255,255,.09);
  --glass-hi:rgba(255,255,255,.13);
  --glass-low:rgba(255,255,255,.06);
  --glass-quiet:rgba(255,255,255,.07);
  --hair:rgba(255,255,255,.08);
  --hair-faint:rgba(255,255,255,.05);
  --field:rgba(255,255,255,.08);
  --field-focus:rgba(255,255,255,.12);
  --track:rgba(255,255,255,.12);
  --tint-gold:rgba(242,196,109,.11);
  --tint-gold-hi:rgba(242,196,109,.16);
  --tint-fog:rgba(163,198,214,.12);
  --tooltip:rgba(7,12,8,.9);
  --menu:#1A2219;
  --on-accent:#17150D;
  --edge-glow:rgba(255,255,255,.85);
  --f-body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-script:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gutter:32px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scroll-padding-top:120px}
body{margin:0;min-height:100vh;background:var(--page-grad),var(--page);color:var(--ink);font:300 15px/1.6 var(--f-body);overscroll-behavior-y:none}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--fog)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
option{background:var(--menu);color:var(--ink)}

.bg-scene{position:fixed;inset:0;z-index:-1;background-image:var(--scrim),url("bg.jpg");background-size:cover;background-position:center;transform-origin:50% 40%;will-change:transform}

/* ---------- chrome ---------- */
.chrome{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .3s ease,backdrop-filter .3s ease,-webkit-backdrop-filter .3s ease}
.chrome.scrolled{background:var(--chrome);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.chrome-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:16px;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.brand{font:italic 500 1.8rem/1 var(--f-script);color:var(--ink);white-space:nowrap;letter-spacing:.01em}
.brand span{color:var(--gold)}
.app-tabs{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.app-tabs::-webkit-scrollbar{display:none}
.app-tab{position:relative;padding:8px 15px;font-size:13px;font-weight:500;letter-spacing:.03em;color:var(--mute-faint);background:none;border:0;border-radius:8px;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
.app-tab:hover{color:var(--mute);background:var(--glass-low)}
.app-tab[aria-current="page"]{color:var(--white);background:rgba(255,255,255,.15)}

/* ---------- hero ---------- */
.hero{max-width:1200px;margin:70px auto 0;padding-top:24px;padding-bottom:6px;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.greeting{font-size:clamp(2.1rem,5.2vw,2.9rem);font-weight:300;line-height:1.1;letter-spacing:-.03em;color:var(--white);text-wrap:balance;transition:opacity .25s ease}
.greeting strong{font-weight:600}
.hero-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px;font-size:12.5px;letter-spacing:.02em;color:var(--mute)}
.viewing{display:inline-flex;align-items:center;gap:6px}
.viewing.nudge .chip{animation:nudge .5s ease 2}
@keyframes nudge{50%{transform:translateY(-3px)}}

/* ---------- page grid ---------- */
.page{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:24px;align-items:start;padding-block:10px 80px;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.page.wide{grid-template-columns:minmax(0,1fr)}
main{min-width:0}
.side{position:sticky;top:calc(92px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px}

.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 14px}
main > .sh:first-child,main > .notice + .sh{margin-top:10px}
.sh-label{font-size:15px;font-weight:600;letter-spacing:.03em;color:var(--gold)}
.sh-meta{font-size:12px;color:var(--mute)}
.sh-meta button{margin-left:6px}

/* ---------- liquid glass ---------- */
.glass,.kpi{position:relative;background:var(--glass);border-radius:14px;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.glass.gold{background:var(--tint-gold)}
.glass.gold:hover{background:var(--tint-gold-hi)}
.glass.fog{background:var(--tint-fog)}
.glass.quiet{background:var(--glass-quiet);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}
.glass::before,.kpi::before,.app-tab::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),var(--edge-glow) 0%,transparent 45%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  opacity:0;transition:opacity .25s ease;pointer-events:none;z-index:2;
}
.kpi::before,.app-tab::before{background:radial-gradient(circle 500px at var(--mx,50%) var(--my,50%),var(--edge-glow) 0%,transparent 45%)}
.glow::before{opacity:1}

/* ---------- shared bits ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid2 > :last-child:nth-child(odd){grid-column:1/-1}
.stack{display:flex;flex-direction:column;gap:8px}
.empty{padding:16px 20px;font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.notice{padding:12px 18px;margin-top:10px;font-size:13px;color:var(--ink-soft)}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--c);color:var(--on-accent);white-space:nowrap}
.pill.out{background:none;border:1px solid var(--mute-faint);color:var(--mute)}
.pill-select{appearance:none;-webkit-appearance:none;cursor:pointer;font-size:12px;font-weight:500;padding:3px 12px;border-radius:99px;border:1px solid var(--c);color:var(--c);background:var(--glass-low)}
.pill-select:disabled{cursor:default;opacity:.8}
.icon-btn{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--mute-faint);cursor:pointer;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--glass-low);color:var(--ink)}
.icon-btn svg{width:14px;height:14px}
.btn{font-size:13px;font-weight:500;letter-spacing:.03em;padding:8px 16px;border:0;border-radius:9px;background:var(--gold);color:var(--on-accent);cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--glass-hi);color:var(--ink)}
.btn.small{font-size:12px;padding:5px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font-size:12.5px;color:var(--ink-soft);background:var(--glass-low);border:1px solid var(--hair);border-radius:99px;padding:4px 12px;cursor:pointer;transition:background .15s}
.chip:hover{background:var(--glass)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-accent);border-color:transparent}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:5px}
.bar{height:6px;border-radius:9px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--fern),var(--gold));transition:width .6s ease}
.bar.over i{background:var(--alert)}

/* ---------- forms ---------- */
.composer{display:flex;flex-wrap:wrap;gap:8px;padding:12px;margin-bottom:12px}
.field{font-size:13.5px;color:var(--ink);background:var(--field);border:1px solid var(--hair);border-radius:9px;padding:8px 11px;min-width:0}
.field::placeholder{color:var(--mute-faint)}
.field:focus{outline:none;border-color:rgba(242,196,109,.6);background:var(--field-focus)}
.field.grow{flex:1 1 200px}
.field.num{width:120px;font-family:var(--f-mono);font-size:13px}
.field.date{width:150px}
.composer .actions{display:flex;gap:8px;margin-left:auto}

/* ---------- coming-up spotlight cards ---------- */
.spot{padding:18px 20px;display:flex;flex-direction:column;gap:5px}
.spot-title{font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em;color:var(--white);padding-right:96px;text-wrap:balance;overflow-wrap:anywhere}
.spot-badge{position:absolute;top:16px;right:16px;font:400 11px/1.6 var(--f-mono);padding:1px 9px;border-radius:99px;background:var(--glass);color:var(--gold)}
.spot-badge.late{color:var(--alert)}
.spot-deck{font-size:12px;color:var(--fog);letter-spacing:.01em}
.spot-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}

/* ---------- task rows ---------- */
.task{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:11px 12px 11px 14px}
.task-body{flex:1 1 220px;min-width:0}
.task-title{font-size:14px;font-weight:400;color:var(--ink);overflow-wrap:anywhere}
.task.is-done .task-title{text-decoration:line-through;color:var(--mute-faint)}
.task-meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--mute)}
.due-late{color:var(--alert)}
.due-soon{color:var(--gold)}
.task-tools{display:flex;align-items:center;gap:2px;margin-left:auto}
.task-tools .pill-select{margin-right:6px}
.check{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--c);background:none;color:transparent;cursor:pointer;transition:background .15s,color .15s}
.check:hover{color:var(--c);background:var(--glass-low)}
.check.on{background:var(--c);color:var(--on-accent)}
.check:disabled{cursor:default}
.check svg{width:14px;height:14px}

/* ---------- quiet list ---------- */
.quiet-list{padding:4px 20px}
.quiet-scroll{max-height:440px;overflow-y:auto;scrollbar-width:none}
.quiet-scroll::-webkit-scrollbar{display:none}
.q-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--hair-faint)}
.q-row:last-child{border-bottom:0}
.q-name{font-size:13px;font-weight:500;color:var(--white);overflow-wrap:anywhere}
.q-row.read .q-name{font-weight:400;color:var(--ink-soft)}
.q-meta{font-size:11px;color:var(--lichen);white-space:nowrap}
.q-note{grid-column:1/-1;font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.q-link{grid-column:1/-1;font-size:12px;text-decoration:none;opacity:.8;justify-self:start}
.q-link:hover{opacity:1;text-decoration:underline}
.fresh{margin-top:8px;font-size:11px;color:var(--mute-faint)}

/* ---------- cards: people + budget ---------- */
.card{padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-head > div{min-width:0}
.card-name{font-size:14px;font-weight:600;color:var(--white);overflow-wrap:anywhere}
.card-deck{font-size:12px;color:var(--lichen);margin-top:1px}
.card-tools{display:flex;flex:none}
.contact{display:flex;align-items:center;gap:4px;font:400 12px var(--f-mono);color:var(--fog);min-width:0}
.contact span{overflow-wrap:anywhere;user-select:text}
.contact .icon-btn{width:26px;height:26px}
.status-select{align-self:flex-start}
.note-field{width:100%;font-size:12.5px}
.figs{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute)}
.figs b{font:400 13px var(--f-mono);color:var(--ink)}
.figs label{display:flex;align-items:center;gap:8px}
.card-note{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}

/* ---------- budget summary / event panels ---------- */
.summary{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.summary-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--lichen)}
.stat-val{font-size:1.35rem;font-weight:600;letter-spacing:-.02em;color:var(--white);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.stat-sub{font-size:11px;color:var(--mute-faint)}
.event{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 36px;align-items:center;padding:22px 24px;margin-top:10px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--lichen);margin-bottom:6px}
.count-n{font-size:3.4rem;font-weight:600;line-height:1;letter-spacing:-.04em;color:var(--white);font-variant-numeric:tabular-nums}
.count-l{font-size:12.5px;color:var(--mute);margin-top:4px}
.facts{display:flex;flex-direction:column}
.fact{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--hair-faint)}
.fact:last-child{border-bottom:0}
.fact-l{color:var(--mute);white-space:nowrap}
.fact-v{color:var(--ink);text-align:right}

/* ---------- sidebar widgets ---------- */
.widget{padding:14px 16px}
.wlabel{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--lichen);margin-bottom:8px}
.wdiv{border:0;border-top:1px solid var(--hair);margin:0 0 8px}
.cd-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:6px 0}
.cd-row + .cd-row{border-top:1px solid var(--hair-faint)}
.cd-n{font-size:1.7rem;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--white);font-variant-numeric:tabular-nums}
.cd-l{font-size:11px;color:var(--mute);margin-top:4px}
.cd-date{font:400 11px var(--f-mono);color:var(--fog);white-space:nowrap}
.now-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-faint);margin-bottom:6px}
.now-val{font-size:1.9rem;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--white);font-variant-numeric:tabular-nums;margin-bottom:6px}
.now-change{font:400 11px var(--f-mono);color:var(--fern)}
.now-sub{font-size:10.5px;color:var(--mute-faint);margin-top:4px}
.wk-row{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--mute);padding:5px 0;border-bottom:1px solid var(--hair-faint)}
.wk-row:last-child{border-bottom:0}
.wk-row.today{color:var(--white)}
.wk-row.late{color:var(--alert)}
.wk-day{flex:none;min-width:4.4rem;font:400 10.5px var(--f-mono)}
.wk-row.today .wk-day{color:var(--fog)}
.wk-desc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-row.today .wk-desc{font-weight:500}
.wk-row.empty-day .wk-desc{color:var(--mute-faint)}
.wk-dot{flex:none;width:5px;height:5px;border-radius:50%;background:var(--fern);align-self:center}
.load-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--hair-faint)}
.load-row:last-child{border-bottom:0}
.load-row b{font:400 12px var(--f-mono);color:var(--white)}
.photo{position:relative;margin:0 -16px -14px;border-radius:0 0 14px 14px;overflow:hidden;aspect-ratio:4/5;background:var(--glass-low)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease}
.photo-tools{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.photo-dots{display:flex;gap:5px}
.photo-dots button{width:7px;height:7px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.45);cursor:pointer}
.photo-dots button[aria-current="true"]{background:var(--white)}
.photo-tools .icon-btn{background:var(--tooltip);color:var(--ink)}
.photo-actions{display:flex;gap:4px}
.wlabel-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.wlabel-row .wlabel{margin:0}
.link-btn{font-size:11.5px;color:var(--fog);background:none;border:0;padding:0;cursor:pointer}
.link-btn:hover{text-decoration:underline}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:10px 0 14px}
.kpi{background:rgba(255,255,255,.08);padding:16px 18px;min-width:0;overflow:hidden;transition:background .15s}
.kpi:hover{background:var(--glass-hi)}
.kpi-lbl{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--lichen);margin-bottom:6px}
.kpi-val{font-size:1.9rem;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--white);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-sub{font-size:10.5px;color:var(--mute-faint);margin-top:5px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dcard{padding:20px;min-width:0;overflow:hidden}
.dcard-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.dcard-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--lichen)}
.dcard-meta{font-size:10.5px;color:var(--mute-faint);background:var(--hair-faint);padding:2px 8px;border-radius:4px;white-space:nowrap}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.donut{width:100%;max-width:230px;display:block}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px}
.leg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft)}
.leg i{width:8px;height:8px;border-radius:2px;flex:none}
.leg b{font:400 12px var(--f-mono);color:var(--white)}
.hbars{width:100%;display:block}
.chart-empty{font-size:13px;color:var(--mute);padding:30px 0;text-align:center}
.dseg{cursor:pointer;transition:stroke-dasharray var(--dur,.6s) cubic-bezier(.22,1,.36,1) var(--delay,0s),stroke-width .15s,filter .15s}
.dseg:hover{stroke-width:32;filter:brightness(1.2)}
.donut-track{stroke:var(--hair-faint)}
.donut-total{fill:var(--white);font:600 30px var(--f-body)}
.donut-cap{fill:var(--mute);font:400 11px var(--f-body)}
.hbar{transform-box:fill-box;transform-origin:left center;transition:transform .9s cubic-bezier(.22,1,.36,1) var(--delay,0s),filter .15s}
.hbar[data-drill-type]{cursor:pointer}
.hbar:hover{filter:brightness(1.25)}
.hbar-track{fill:var(--glass-low)}
.chart-text{fill:var(--ink-soft);font:400 11px var(--f-body)}
.chart-num{fill:var(--mute);font:400 10.5px var(--f-mono)}
.drill{margin-top:12px;overflow:hidden;transform-origin:top center;transition:opacity .16s ease,transform .16s ease}
.drill-hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:13px 12px 13px 18px;border-bottom:1px solid var(--hair)}
.drill-title{font-size:14px;font-weight:600;color:var(--c)}
.drill-hd .icon-btn{margin-left:auto}
.drill-scroll{max-height:440px;overflow:auto}
.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{padding:8px 18px;text-align:left;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute-faint);border-bottom:1px solid var(--hair-faint)}
.dt td{padding:8px 18px;color:var(--ink);border-bottom:1px solid rgba(255,255,255,.035)}
.dt tbody tr:last-child td{border-bottom:0}
.dt tbody tr:hover{background:var(--glass-low)}
.dt .sub{color:var(--mute)}
.dt .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- overlays ---------- */
#tooltip{position:fixed;z-index:300;pointer-events:none;min-width:150px;padding:10px 14px;border-radius:12px;background:var(--tooltip);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 40px rgba(0,0,0,.48)}
.tt-title{font-size:13px;font-weight:600;color:var(--white);margin-bottom:6px}
.tt-body{display:flex;align-items:center;gap:7px}
.tt-dot{width:9px;height:9px;border-radius:2px}
.tt-val{font:400 12px var(--f-mono);color:var(--ink)}
.tt-pct{font:400 11px var(--f-mono);color:var(--mute);margin-left:4px}
#toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:250;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:8px 8px 8px 16px;border-radius:99px;background:var(--tooltip);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.4);font-size:13px;color:var(--ink)}
#toast .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--fern)}
#toast.bad .dot{background:var(--alert)}
#toast .msg{padding-right:8px}
#toast button{flex:none;font-size:12px;font-weight:500;background:var(--glass-hi);border:0;border-radius:99px;padding:4px 12px;cursor:pointer}

/* ---------- small screens ---------- */
@media (max-width:860px){
  :root{--gutter:16px}
  .chrome-inner{flex-wrap:wrap;gap:8px;padding-bottom:10px}
  .app-tabs{width:100%}
  .hero{margin-top:104px}
  .page{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .grid2,.charts{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .event{grid-template-columns:minmax(0,1fr)}
  .photo{aspect-ratio:4/3}
}
@media (max-width:480px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .composer .actions{margin-left:0}
  .field.num,.field.date{flex:1 1 120px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before{transition:none!important;animation:none!important}
}
</style>

<div class="bg-scene" id="scene"></div>

<header class="chrome" id="chrome">
  <div class="chrome-inner">
    <span class="brand">Rachel <span>&amp;</span> Xavier</span>
    <nav class="app-tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>

<section class="hero">
  <p class="greeting" id="greeting">Two celebrations, <strong>one plan.</strong></p>
  <div class="hero-sub" id="hero-sub"></div>
</section>

<div class="page" id="page">
  <main id="main"></main>
  <aside class="side" id="side" aria-label="At a glance">
    <div class="widget glass" id="w-countdown"></div>
    <div class="widget glass fog" id="w-money"></div>
    <div class="widget glass" id="w-photos"></div>
    <div class="widget glass" id="w-week"></div>
    <div class="widget glass" id="w-load"></div>
  </aside>
</div>

<div id="tooltip" hidden><p class="tt-title" id="tt-title"></p><div class="tt-body" id="tt-body"></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="photo-input" accept="image/*" multiple hidden>

<script>
"use strict";

/* ===================== fixed facts ===================== */

const EVENTS = {
  elopement: {
    label: "Elopement", region: "California", date: "2027-04-22",
    facts: [
      ["Date", "Thursday, April 22, 2027"],
      ["Place", "Redwood National Park, California"],
      ["Photo + film", "Natasha Cardinal · 8 hours, photo and Super 8"],
    ],
  },
  reception: {
    label: "Reception", region: "Texas", date: "2027-07-09",
    facts: [
      ["Date", "Friday, July 9, 2027"],
      ["Time", "5:00 to 10:00 pm"],
      ["Venue", "The Betty, Texas · full buyout, inside and patio"],
      ["Guests", "150"],
    ],
  },
};
const PARTS = { elopement: "Elopement", reception: "Reception", general: "General" };
const PEOPLE = {
  xavier: { name: "Xavier", color: "var(--fog)" },
  rachel: { name: "Rachel", color: "var(--rose)" },
  both:   { name: "Both",   color: "var(--fern)" },
};
const UNASSIGNED_COLOR = "var(--mute)";
const STATUSES = { "Researching": "var(--lichen)", "Contacted": "var(--fog)", "Booked": "var(--fern)", "Paid in full": "var(--gold)" };
const TABS = [["home","Home"],["elopement","Elopement"],["reception","Reception"],["budget","Budget"],["people","People"],["inbox","Inbox"],["dashboard","Dashboard"]];
const GREETINGS = {
  home: ["Good {part}, <strong>{name}.</strong>", "Two celebrations, <strong>one plan.</strong>", "Here's where things stand, <strong>{name}.</strong>", "Let's knock a few out, <strong>{name}.</strong>"],
  elopement: ["The redwoods, <strong>April 22.</strong>", "Just the two of you, <strong>under the redwoods.</strong>"],
  reception: ["The Betty, <strong>July 9.</strong>", "150 people, <strong>one long Texas night.</strong>"],
  budget: ["Where the <strong>money goes.</strong>", "Planned versus <strong>paid.</strong>"],
  people: ["The people <strong>behind it all.</strong>", "Vendors, family <strong>and friends.</strong>"],
  inbox: ["Straight from <strong>your vendors.</strong>", "What's new in <strong>the inbox.</strong>"],
  dashboard: ["The <strong>big picture.</strong>", "How's it looking, <strong>{name}?</strong>", "Let's see where we stand, <strong>{name}.</strong>"],
};
const MAIL_RETRACT = new Set(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","not_granted","capability_disabled","capability_removed"]);
const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;

const ICON = {
  check: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  edit: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8h-3v-3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  close: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  copy: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5v-.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  image: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 11.5l3.5-3.5 3 3 2-2 2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
};

/* ===================== state ===================== */

const state = {
  tab: "home",
  filter: "all",
  me: "",
  tasks: [], budget: [], people: [], photos: [], settings: {},
  loaded: new Set(),
  status: "loading",      // loading | live | offline
  canWrite: true,
  writeUnknown: false,
  editing: "",            // "task:<id>" | "item:<id>" | "person:<id>"
  drill: null,            // {type, key} on the dashboard
  photoIndex: 0,
  mail: { status: "off", threads: [], code: "", storedAt: 0 },
};
let db = null, mcp = null, assets = null, uid = null;
let mailUnwatch = null, mailQuery = null, mailInput = null;
let animateDash = false;

try { state.me = localStorage.getItem("wedding-hq:me") || ""; } catch (e) {}

/* ===================== helpers ===================== */

const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sum = (rows, key) => rows.reduce((t, r) => t + (Number(r[key]) || 0), 0);
const money = (n) => { const v = Number(n) || 0; return (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const moneyShort = (n) => { const v = Number(n) || 0; if (Math.abs(v) < 10000) return money(Math.round(v)); return "$" + (v / 1000).toFixed(v >= 100000 ? 0 : 1).replace(/\.0$/, "") + "K"; };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const parseDay = (s) => new Date(s + "T00:00:00");
const daysUntil = (s) => Math.round((parseDay(s) - startOfToday()) / 864e5);
const fmtDay = (s, opts) => (s ? parseDay(s).toLocaleDateString("en-US", opts || { month: "short", day: "numeric", year: "numeric" }) : "");
const fmtStamp = (ms) => new Date(ms).toLocaleDateString("en-US", { month: "short", day: "numeric" });
const decodeEntities = (s) => { const t = document.createElement("textarea"); t.innerHTML = s || ""; return t.value; };
const personColor = (key) => (PEOPLE[key] ? PEOPLE[key].color : UNASSIGNED_COLOR);
const viewerName = () => (PEOPLE[state.me] ? PEOPLE[state.me].name : "you two");
const partOfDay = () => { const h = new Date().getHours(); return h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"; };
const photoUrl = (assetId) => "/_blob/" + encodeURIComponent(assetId);

// The engagement photos ship with the page. Photos added in the album join them.
// `key` is what settings.background stores: a built-in id, or an uploaded asset id.
const BUILTIN_PHOTOS = [
  { key: "builtin-proposal", src: "photos/proposal.jpg", caption: "The proposal, under the red maple", focus: "42% 68%" },
  { key: "builtin-harbor", src: "photos/harbor.jpg", caption: "Rachel and Xavier on the Boston waterfront", focus: "50% 58%" },
  { key: "builtin-ring", src: "photos/ring.jpg", caption: "Rachel's ring", focus: "50% 45%" },
  { key: "builtin-hands", src: "photos/hands.jpg", caption: "Holding hands", focus: "50% 50%" },
];
const allPhotos = () => [
  ...BUILTIN_PHOTOS,
  ...state.photos.map((p) => ({ key: p.asset, id: p.id, src: photoUrl(p.asset), caption: p.caption, focus: "50% 50%", uploaded: true })),
];

function byDue(a, b) {
  const da = a.due || "9999", dbb = b.due || "9999";
  return da < dbb ? -1 : da > dbb ? 1 : String(a.title).localeCompare(String(b.title));
}
const openFirst = (a, b) => (Number(!!a.done) - Number(!!b.done)) || byDue(a, b);

function dueText(t) {
  if (!t.due) return "";
  const d = daysUntil(t.due);
  if (d < 0) return `${plural(-d, "day")} late`;
  if (d === 0) return "Due today";
  if (d === 1) return "Due tomorrow";
  if (d < 7) return `Due in ${d} days`;
  const sameYear = parseDay(t.due).getFullYear() === new Date().getFullYear();
  return "Due " + fmtDay(t.due, sameYear ? { month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" });
}

function countdown(dateStr) {
  const d = daysUntil(dateStr);
  if (d > 1) return { n: d, label: "days to go" };
  if (d === 1) return { n: 1, label: "day to go" };
  if (d === 0) return { n: "Today", label: "it's happening" };
  return { n: "Done", label: "celebrated " + fmtDay(dateStr) };
}

const section = (label, meta = "") => `<div class="sh"><h2 class="sh-label">${label}</h2>${meta ? `<span class="sh-meta">${meta}</span>` : ""}</div>`;
const empty = (msg, extra = "") => `<div class="empty glass quiet"><span>${state.status === "loading" ? "Loading your plan…" : msg}</span>${state.status === "loading" ? "" : extra}</div>`;
const pill = (key) => (PEOPLE[key] ? `<span class="pill" style="--c:${PEOPLE[key].color}">${PEOPLE[key].name}</span>` : `<span class="pill out">Unassigned</span>`);
const bar = (p, over) => `<div class="bar${over ? " over" : ""}"><i style="width:${Math.min(100, Math.max(0, p))}%"></i></div>`;
const disabled = () => (state.canWrite ? "" : " disabled");

function personOptions(selected, withUnassigned = true) {
  const opts = withUnassigned ? [["", "Unassigned"]] : [];
  Object.entries(PEOPLE).forEach(([k, v]) => opts.push([k, v.name]));
  return opts.map(([v, l]) => `<option value="${v}"${(selected || "") === v ? " selected" : ""}>${l}</option>`).join("");
}
function partSelect(id, selected) {
  return `<select id="${id}" class="field" name="part" aria-label="Part of the wedding">${Object.entries(PARTS).map(([k, v]) => `<option value="${k}"${k === selected ? " selected" : ""}>${v}</option>`).join("")}</select>`;
}

/* ===================== components ===================== */

function taskRow(t) {
  if (state.editing === "task:" + t.id) return taskEditForm(t);
  const id = esc(t.id);
  const checkColor = t.done ? personColor(t.doneBy) : "var(--fern)";
  const meta = [];
  if (t.done) {
    meta.push(`Done by ${PEOPLE[t.doneBy] ? PEOPLE[t.doneBy].name : "someone"}${t.doneAt ? " · " + fmtStamp(t.doneAt) : ""}`);
  } else if (t.due) {
    const d = daysUntil(t.due);
    meta.push(`<span class="${d < 0 ? "due-late" : d <= 7 ? "due-soon" : ""}">${dueText(t)}</span>`);
  }
  if (state.tab === "home") meta.push(esc(PARTS[t.part] || "General"));
  return `<div class="task glass${t.done ? " is-done" : ""}">
    <button class="check${t.done ? " on" : ""}" style="--c:${checkColor}" data-action="toggle" data-id="${id}" aria-pressed="${!!t.done}" aria-label="${t.done ? "Mark not done" : "Mark done"}: ${esc(t.title)}"${disabled()}>${ICON.check}</button>
    <div class="task-body"><div class="task-title">${esc(t.title)}</div>${meta.length ? `<div class="task-meta">${meta.map((m) => `<span>${m}</span>`).join("")}</div>` : ""}</div>
    <div class="task-tools">
      <select id="who-${id}" class="pill-select" style="--c:${personColor(t.who)}" data-change="task-who" data-id="${id}" aria-label="Who's on it"${disabled()}>${personOptions(t.who)}</select>
      ${state.canWrite ? `<button class="icon-btn" data-action="edit" data-id="task:${id}" aria-label="Edit task">${ICON.edit}</button><button class="icon-btn" data-action="delete" data-kind="tasks" data-id="${id}" aria-label="Delete task">${ICON.close}</button>` : ""}
    </div>
  </div>`;
}

function taskEditForm(t) {
  return `<form class="composer glass" data-form="edit-task" data-id="${esc(t.id)}" autocomplete="off">
    <input id="edit-task-title" class="field grow" name="title" value="${esc(t.title)}" aria-label="Task" required maxlength="200">
    ${partSelect("edit-task-part", t.part || "general")}
    <input id="edit-task-due" class="field date" type="date" name="due" value="${esc(t.due || "")}" aria-label="Due date">
    <div class="actions"><button type="button" class="btn ghost" data-action="cancel">Cancel</button><button class="btn">Save</button></div>
  </form>`;
}

function taskForm(part) {
  if (!state.canWrite) return "";
  const scope = part || "all";
  return `<form class="composer glass quiet" data-form="add-task" autocomplete="off">
    <input id="add-task-title-${scope}" class="field grow" name="title" placeholder="Add a task, like “Book the hair trial”" aria-label="New task" required maxlength="200">
    <select id="add-task-who-${scope}" class="field" name="who" aria-label="Who's on it">${personOptions(state.me)}</select>
    ${part ? `<input id="add-task-part-${scope}" type="hidden" name="part" value="${part}">` : partSelect("add-task-part-" + scope, "general")}
    <input id="add-task-due-${scope}" class="field date" type="date" name="due" aria-label="Due date">
    <div class="actions"><button class="btn">Add task</button></div>
  </form>`;
}

function spotCard(t) {
  const d = daysUntil(t.due);
  const badge = d < 0 ? `${plural(-d, "day")} late` : d === 0 ? "Today" : d === 1 ? "Tomorrow" : `in ${d} days`;
  return `<article class="spot glass gold">
    <span class="spot-badge${d < 0 ? " late" : ""}">${badge}</span>
    <h3 class="spot-title">${esc(t.title)}</h3>
    <p class="spot-deck">${fmtDay(t.due, { weekday: "short", month: "short", day: "numeric" })} · ${esc(PARTS[t.part] || "General")}</p>
    <div class="spot-foot">${pill(t.who)}${state.canWrite ? `<button class="btn small ghost" data-action="toggle" data-id="${esc(t.id)}">Mark done</button>` : ""}</div>
  </article>`;
}

function personCard(p) {
  if (state.editing === "person:" + p.id) return personEditForm(p);
  const id = esc(p.id);
  const statuses = Object.keys(STATUSES);
  if (p.status && !STATUSES[p.status]) statuses.push(p.status);
  const contact = (value, label) => value ? `<div class="contact"><span>${esc(value)}</span><button class="icon-btn" data-action="copy" data-copy="${esc(value)}" aria-label="Copy ${label}">${ICON.copy}</button></div>` : "";
  return `<article class="card glass">
    <div class="card-head">
      <div><h3 class="card-name">${esc(p.name)}</h3>${p.role ? `<p class="card-deck">${esc(p.role)}</p>` : ""}</div>
      ${state.canWrite ? `<div class="card-tools"><button class="icon-btn" data-action="edit" data-id="person:${id}" aria-label="Edit ${esc(p.name)}">${ICON.edit}</button><button class="icon-btn" data-action="delete" data-kind="people" data-id="${id}" aria-label="Delete ${esc(p.name)}">${ICON.close}</button></div>` : ""}
    </div>
    <select id="status-${id}" class="pill-select status-select" style="--c:${STATUSES[p.status] || "var(--lichen)"}" data-change="person-status" data-id="${id}" aria-label="Status"${disabled()}>${statuses.map((s) => `<option${(p.status || "Researching") === s ? " selected" : ""}>${esc(s)}</option>`).join("")}</select>
    ${contact(p.email, "email")}${contact(p.phone, "phone number")}
    <input id="note-${id}" class="field note-field" data-change="person-note" data-id="${id}" value="${esc(p.note || "")}" placeholder="${state.canWrite ? "Add a note" : "No notes"}" aria-label="Notes about ${esc(p.name)}"${disabled()}>
  </article>`;
}

function personEditForm(p) {
  return `<form class="composer glass" data-form="edit-person" data-id="${esc(p.id)}" autocomplete="off">
    <input id="edit-person-name" class="field grow" name="name" value="${esc(p.name)}" aria-label="Name" required maxlength="120">
    <input id="edit-person-role" class="field grow" name="role" value="${esc(p.role || "")}" placeholder="Role" aria-label="Role" maxlength="120">
    <input id="edit-person-email" class="field grow" type="email" name="email" value="${esc(p.email || "")}" placeholder="Email" aria-label="Email">
    <input id="edit-person-phone" class="field" name="phone" value="${esc(p.phone || "")}" placeholder="Phone" aria-label="Phone" maxlength="40">
    ${partSelect("edit-person-part", p.part || "general")}
    <div class="actions"><button type="button" class="btn ghost" data-action="cancel">Cancel</button><button class="btn">Save</button></div>
  </form>`;
}

function personForm(part) {
  if (!state.canWrite) return "";
  const scope = part || "all";
  return `<form class="composer glass quiet" data-form="add-person" autocomplete="off">
    <input id="add-person-name-${scope}" class="field grow" name="name" placeholder="Name" aria-label="Name" required maxlength="120">
    <input id="add-person-role-${scope}" class="field grow" name="role" placeholder="Role, like Florist" aria-label="Role" maxlength="120">
    <input id="add-person-email-${scope}" class="field grow" type="email" name="email" placeholder="Email" aria-label="Email">
    <input id="add-person-phone-${scope}" class="field" name="phone" placeholder="Phone" aria-label="Phone" maxlength="40">
    ${part ? `<input id="add-person-part-${scope}" type="hidden" name="part" value="${part}">` : partSelect("add-person-part-" + scope, "general")}
    <div class="actions"><button class="btn">Add person</button></div>
  </form>`;
}

function itemCard(i) {
  if (state.editing === "item:" + i.id) return itemEditForm(i);
  const id = esc(i.id), planned = Number(i.planned) || 0, paid = Number(i.paid) || 0;
  return `<article class="card glass">
    <div class="card-head">
      <div><h3 class="card-name">${esc(i.name)}</h3><p class="card-deck">${paid >= planned && planned > 0 ? "Paid in full" : planned ? `${money(planned - paid)} left to pay` : "No amount planned"}</p></div>
      ${state.canWrite ? `<div class="card-tools"><button class="icon-btn" data-action="edit" data-id="item:${id}" aria-label="Edit ${esc(i.name)}">${ICON.edit}</button><button class="icon-btn" data-action="delete" data-kind="budget" data-id="${id}" aria-label="Delete ${esc(i.name)}">${ICON.close}</button></div>` : ""}
    </div>
    <div class="figs"><span>Planned <b>${money(planned)}</b></span><label for="paid-${id}">Paid <input id="paid-${id}" class="field num" type="number" min="0" step="0.01" inputmode="decimal" value="${paid || ""}" placeholder="0" data-change="item-paid" data-id="${id}"${disabled()}></label></div>
    ${bar(pct(paid, planned), paid > planned && planned > 0)}
    ${i.note ? `<p class="card-note">${esc(i.note)}</p>` : ""}
  </article>`;
}

function itemEditForm(i) {
  return `<form class="composer glass" data-form="edit-item" data-id="${esc(i.id)}" autocomplete="off">
    <input id="edit-item-name" class="field grow" name="name" value="${esc(i.name)}" aria-label="Item" required maxlength="120">

/* ===================== mail ===================== */

function mailErrorText(code) {
  switch (code) {
    case "server_not_connected": return "Connect Gmail in claude.ai Settings → Connectors to see vendor emails here.";
    case "needs_reauth": return "Gmail needs reconnecting. Reconnect it in claude.ai Settings → Connectors.";
    case "approval_required": return "This page needs your OK before it can read Gmail.";
    case "not_in_manifest": return "Gmail is turned off for this page. Turn it back on from the page's Permissions menu.";
    case "selection_required": return "You have more than one Gmail connected. Pick one when claude.ai asks.";
    case "blocked_by_policy": return "Your organization doesn't allow Gmail here.";
    case "not_granted": case "capability_disabled": case "capability_removed": return "Emails aren't available in this view.";
    case "server_unavailable": return "Gmail isn't answering right now. It will try again shortly.";
    default: return "Couldn't load emails just now. Try Refresh.";
  }
}

function contactFor(sender) {
  const s = String(sender || "").toLowerCase();
  return state.people.find((p) => p.email && s.includes(String(p.email).trim().toLowerCase()));
}

function mailRow(th) {
  const msgs = Array.isArray(th.messages) ? th.messages : [];
  const first = msgs[0] || {}, last = msgs[msgs.length - 1] || {};
  const unread = msgs.some((m) => (m.labelIds || []).includes("UNREAD"));
  const who = contactFor(last.sender);
  const sender = who ? who.name : String(last.sender || "").replace(/<.*>/, "").trim() || last.sender || "Unknown sender";
  const when = last.date ? new Date(last.date).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "";
  const url = typeof th.viewUrl === "string" && th.viewUrl.startsWith("https://mail.google.com/") ? th.viewUrl : "";
  return `<div class="q-row${unread ? "" : " read"}">
    <span class="q-name">${esc(first.subject || "(no subject)")}</span>
    <span class="q-meta">${esc(sender)}${when ? " · " + when : ""}</span>
    <span class="q-note">${esc(decodeEntities(last.snippet).slice(0, 180))}</span>
    ${url ? `<a class="q-link" href="${esc(url)}" target="_blank" rel="noopener">Open in Gmail</a>` : ""}
  </div>`;
}

function mailList(limit) {
  const m = state.mail;
  if (m.status === "off") return empty("Vendor emails show up here when this page is open in Claude with Gmail connected.");
  if (m.status === "no-contacts") return empty("Add an email address to someone on the People tab and their messages will show up here.");
  if (m.status === "loading" && !m.threads.length) return empty("Checking Gmail…");
  if (m.status === "error" && !m.threads.length) {
    return empty(mailErrorText(m.code), m.code === "approval_required" ? `<button class="btn small" data-action="allow-gmail">Allow Gmail</button>` : "");
  }
  if (!m.threads.length) return empty("No emails from your contacts in the last 60 days.");
  const warn = m.status === "error" ? `<div class="q-row"><span class="q-note">${esc(mailErrorText(m.code))} Showing what loaded last.</span></div>` : "";
  const mins = m.storedAt ? Math.round((Date.now() - m.storedAt) / 60000) : 0;
  return `<div class="quiet-list glass quiet"><div class="quiet-scroll">${warn}${m.threads.slice(0, limit).map(mailRow).join("")}</div></div>
    <p class="fresh">Updated ${mins < 1 ? "just now" : plural(mins, "minute") + " ago"} · last 60 days from your contacts</p>`;
}

/* ---------- dashboard ---------- */

function donutSVG(segs, kind, center) {
  const size = 240, r = 86, sw = 26, c = size / 2, C = 2 * Math.PI * r;
  const total = segs.reduce((s, x) => s + x.v, 0);
  let out = `<svg class="donut" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(center.cap)}: ${segs.map((s) => `${s.name} ${s.label || s.v}`).join(", ")}">`;
  out += `<circle class="donut-track" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${sw}"/>`;
  let offset = 0, delay = 0;
  segs.forEach((seg) => {
    if (!seg.v || !total) return;
    const len = (seg.v / total) * C, dur = Math.max(0.12, seg.v / total);
    out += `<circle class="dseg" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${sw}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${c} ${c})" data-circ="${C.toFixed(2)}"
      style="stroke:${seg.color};--dur:${dur.toFixed(2)}s;--delay:${delay.toFixed(2)}s"
      data-tip-name="${esc(seg.name)}" data-tip-val="${esc(seg.label || seg.v)}" data-tip-pct="${pct(seg.v, total)}" data-tip-color="${seg.color}"
      data-drill-type="${kind}" data-drill-key="${esc(seg.key)}"/>`;
    offset += len; delay += dur;
  });
  out += `<text class="donut-total" x="${c}" y="${c + 6}" text-anchor="middle">${esc(center.big)}</text><text class="donut-cap" x="${c}" y="${c + 28}" text-anchor="middle">${esc(center.cap)}</text></svg>`;
  return out;
}

function legend(segs) {
  return `<div class="legend">${segs.map((s) => `<span class="leg"><i style="background:${s.color}"></i>${esc(s.name)}<b>${esc(s.label || s.v)}</b></span>`).join("")}</div>`;
}

// rows: {key, name, v, max?, color, value, tip, drill?}
function hbarSVG(rows, maxVal) {
  const LW = 132, BA = 220, VW = 96, RH = 32, W = LW + BA + VW, H = rows.length * RH + 4;
  let out = `<svg class="hbars" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" role="img" aria-label="${rows.map((r) => `${r.name} ${r.value}`).join(", ")}">`;
  rows.forEach((row, i) => {
    const y = i * RH + RH / 2 + 2;
    const name = row.name.length > 20 ? row.name.slice(0, 19) + "…" : row.name;
    const bw = maxVal ? Math.max(row.v ? 3 : 0, Math.round((row.v / maxVal) * BA)) : 0;
    const back = row.max != null && maxVal ? Math.max(3, Math.round((row.max / maxVal) * BA)) : BA;
    const hover = `data-tip-name="${esc(row.name)}" data-tip-val="${esc(row.tip || row.value)}" data-tip-pct="${row.pct ?? ""}" data-tip-color="${row.color}"${row.drill ? ` data-drill-type="${row.drill}" data-drill-key="${esc(row.key)}"` : ""}`;
    const trackTint = row.max != null ? ` style="fill:${row.color};opacity:.22"` : "";
    out += `<rect class="hbar-track" x="${LW}" y="${y - 7}" width="${back}" height="14" rx="3"${trackTint} ${hover}/>`;
    if (bw) out += `<rect class="hbar" x="${LW}" y="${y - 7}" width="${bw}" height="14" rx="3" style="fill:${row.color};--delay:${(i * 0.055).toFixed(3)}s" ${hover}/>`;
    out += `<text class="chart-text" x="${LW - 10}" y="${y + 4}" text-anchor="end">${esc(name)}</text>`;
    out += `<text class="chart-num" x="${W - 2}" y="${y + 4}" text-anchor="end">${esc(row.value)}</text>`;
  });
  return out + "</svg>";
}

function drillView() {
  const d = state.drill;
  if (!d) return "";
  let title = "", color = "var(--ink)", head = "", rows = [], meta = "";
  const taskRows = (list) => list.sort(openFirst).map((t) => `<tr><td>${esc(t.title)}</td><td class="sub">${esc(PARTS[t.part] || "General")}</td><td class="sub">${t.done ? "Done" : t.due ? fmtDay(t.due, { month: "short", day: "numeric" }) : "—"}</td><td>${pill(t.done ? t.doneBy : t.who)}</td></tr>`);
  if (d.type === "status" || d.type === "person") {
    const open = state.tasks.filter((t) => !t.done);
    let list;
    if (d.key === "done") { list = state.tasks.filter((t) => t.done); title = "Done"; color = "var(--lichen)"; }
    else if (d.key === "none") { list = open.filter((t) => !PEOPLE[t.who]); title = "Unassigned"; color = "var(--mute)"; }
    else if (PEOPLE[d.key]) { list = open.filter((t) => t.who === d.key); title = PEOPLE[d.key].name; color = PEOPLE[d.key].color; }
    else list = [];
    meta = plural(list.length, d.key === "done" ? "finished task" : "open task");
    head = "<th>Task</th><th>Part</th><th>Due</th><th>Who</th>";
    rows = taskRows(list);
  } else if (d.type === "parts") {
    const list = state.budget.filter((i) => (PARTS[i.part] ? i.part : "general") === d.key);
    title = PARTS[d.key] || "General"; color = partColor(d.key);
    meta = `${money(sum(list, "paid"))} paid of ${money(sum(list, "planned"))}`;
    head = `<th>Item</th><th class="num">Planned</th><th class="num">Paid</th>`;
    rows = list.map((i) => `<tr><td>${esc(i.name)}</td><td class="num">${money(i.planned)}</td><td class="num">${money(i.paid)}</td></tr>`);
  }
  return `<section class="drill glass dcard" id="drill" style="padding:0">
    <div class="drill-hd"><span class="drill-title" style="--c:${color}">${esc(title)}</span><span class="dcard-meta">${meta}</span><button class="icon-btn" data-action="close-drill" aria-label="Close table">${ICON.close}</button></div>
    <div class="drill-scroll">${rows.length ? `<table class="dt"><thead><tr>${head}</tr></thead><tbody>${rows.join("")}</tbody></table>` : `<p class="chart-empty">Nothing here yet.</p>`}</div>
  </section>`;
}

const partColor = (k) => ({ elopement: "var(--fern)", reception: "var(--rose)", general: "var(--lichen)" }[k] || "var(--lichen)");

function dashboardView() {
  const all = state.tasks, done = all.filter((t) => t.done), open = all.filter((t) => !t.done);
  const overdue = open.filter((t) => t.due && daysUntil(t.due) < 0).length;
  const thisWeek = open.filter((t) => t.due && daysUntil(t.due) >= 0 && daysUntil(t.due) < 7).length;
  const total = Number(state.settings.budget) || 0, planned = sum(state.budget, "planned"), paid = sum(state.budget, "paid");
  const next = ["elopement", "reception"].map((k) => ({ k, d: daysUntil(EVENTS[k].date) })).find((x) => x.d >= 0);

  const kpis = [
    ["Tasks done", `${done.length}/${all.length}`, all.length ? `${pct(done.length, all.length)}% complete` : "no tasks yet", ""],
    ["Open", open.length, overdue ? `${overdue} overdue` : "none overdue", overdue ? "var(--alert)" : ""],
    ["Due this week", thisWeek, "next 7 days", thisWeek ? "var(--gold)" : ""],
    ["Planned", moneyShort(planned), total ? `of ${money(total)} budget` : "no total set", "var(--fog)"],
    ["Paid", moneyShort(paid), `${money(Math.max(0, planned - paid))} to go`, "var(--fern)"],
    ["Countdown", next ? `${next.d}d` : "—", next ? `to the ${next.k}` : "both celebrated", ""],
  ];
  const kpiHTML = kpis.map(([l, v, s, c]) => `<div class="kpi"><p class="kpi-lbl">${l}</p><p class="kpi-val"${c ? ` style="color:${c}"` : ""}>${esc(v)}</p><p class="kpi-sub">${esc(s)}</p></div>`).join("");

  const status = [
    { key: "xavier", name: "Xavier", v: open.filter((t) => t.who === "xavier").length, color: "var(--fog)" },
    { key: "rachel", name: "Rachel", v: open.filter((t) => t.who === "rachel").length, color: "var(--rose)" },
    { key: "both", name: "Both", v: open.filter((t) => t.who === "both").length, color: "var(--fern)" },
    { key: "none", name: "Unassigned", v: open.filter((t) => !PEOPLE[t.who]).length, color: "var(--mute-faint)" },
    { key: "done", name: "Done", v: done.length, color: "var(--lichen)" },
  ];
  const statusCard = all.length
    ? `<div class="donut-wrap">${donutSVG(status, "status", { big: `${pct(done.length, all.length)}%`, cap: "tasks done" })}${legend(status)}</div>`
    : `<p class="chart-empty">Add tasks to see progress here.</p>`;

  const loadRows = status.filter((s) => s.key !== "done").map((s) => ({ ...s, value: plural(s.v, "task"), pct: pct(s.v, open.length), drill: "person" }));
  const loadMax = Math.max(1, ...loadRows.map((r) => r.v));
  const loadCard = open.length ? hbarSVG(loadRows, loadMax) : `<p class="chart-empty">No open tasks. Nice.</p>`;

  const items = [...state.budget].sort((a, b) => (Number(b.planned) || 0) - (Number(a.planned) || 0)).slice(0, 8);
  const itemMax = Math.max(1, ...items.map((i) => Math.max(Number(i.planned) || 0, Number(i.paid) || 0)));
  const itemRows = items.map((i) => ({ key: i.id, name: i.name, v: Number(i.paid) || 0, max: Number(i.planned) || 0, color: partColor(PARTS[i.part] ? i.part : "general"), value: moneyShort(i.planned), tip: `${money(i.paid)} paid of ${money(i.planned)}`, pct: pct(Number(i.paid) || 0, Number(i.planned) || 0) }));
  const itemsChart = items.length ? hbarSVG(itemRows, itemMax) : `<p class="chart-empty">Add budget items to compare planned and paid.</p>`;

  const parts = Object.keys(PARTS).map((k) => {
    const v = sum(state.budget.filter((i) => (PARTS[i.part] ? i.part : "general") === k), "planned");
    return { key: k, name: PARTS[k], v, label: moneyShort(v), color: partColor(k) };
  });
  const partsCard = planned
    ? `<div class="donut-wrap">${donutSVG(parts, "parts", { big: moneyShort(planned), cap: "planned" })}${legend(parts)}</div>`
    : `<p class="chart-empty">Nothing planned yet.</p>`;

  const card = (lbl, meta, body) => `<section class="dcard glass"><div class="dcard-hd"><h3 class="dcard-lbl">${lbl}</h3><span class="dcard-meta">${meta}</span></div>${body}</section>`;
  return `${notice()}
    <div class="kpis">${kpiHTML}</div>
    <div class="charts">
      ${card("Tasks by status", plural(all.length, "task"), statusCard)}
      ${card("Open tasks by person", "tap a bar for the list", loadCard)}
      ${card("Budget by item", "bright = paid", itemsChart)}
      ${card("Planned by celebration", money(planned), partsCard)}
    </div>
    ${drillView()}`;
}

function renderSide() {
  const open = state.tasks.filter((t) => !t.done);
  const total = Number(state.settings.budget) || 0, planned = sum(state.budget, "planned"), paid = sum(state.budget, "paid");

  $("#w-countdown").innerHTML = `<p class="wlabel">Countdown</p><hr class="wdiv">` + ["elopement", "reception"].map((k) => {
    const cd = countdown(EVENTS[k].date);
    return `<div class="cd-row"><div><div class="cd-n">${cd.n}</div><div class="cd-l">${typeof cd.n === "number" ? `${cd.label} · ${k}` : `${EVENTS[k].label}: ${cd.label}`}</div></div><span class="cd-date">${fmtDay(EVENTS[k].date, { month: "short", day: "numeric" })}</span></div>`;
  }).join("");

  $("#w-money").innerHTML = `<p class="now-label">Budget · planned so far</p>
    <p class="now-val">${money(planned)}</p>
    <p class="now-change">${money(paid)} paid · ${pct(paid, planned)}%</p>
    <p class="now-sub">${total ? `of ${money(total)} total · ${planned > total ? money(planned - total) + " over" : money(total - planned) + " unallocated"}` : "Set a total on the Budget tab"}</p>`;

  const t0 = startOfToday(), rows = [];
  const late = open.filter((t) => t.due && daysUntil(t.due) < 0);
  if (late.length) rows.push(`<div class="wk-row late"><span class="wk-day">Overdue</span><span class="wk-desc">${esc(late.sort(byDue)[0].title)}${late.length > 1 ? ` +${late.length - 1}` : ""}</span></div>`);
  for (let i = 0; i < 7; i++) {
    const d = new Date(t0); d.setDate(t0.getDate() + i);
    const due = open.filter((t) => t.due === isoDay(d));
    const day = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    rows.push(`<div class="wk-row${i === 0 ? " today" : ""}${due.length ? "" : " empty-day"}"><span class="wk-day">${day}</span><span class="wk-desc">${due.length ? esc(due[0].title) + (due.length > 1 ? ` +${due.length - 1}` : "") : "Nothing due"}</span>${i === 0 ? '<span class="wk-dot"></span>' : ""}</div>`);
  }
  $("#w-week").innerHTML = `<p class="wlabel">Week at a glance</p><hr class="wdiv">${rows.join("")}`;

  $("#w-load").innerHTML = `<p class="wlabel">Open tasks</p><hr class="wdiv">` +
    ["xavier", "rachel", "both", ""].map((k) => `<div class="load-row">${pill(k)}<b>${open.filter((t) => (PEOPLE[t.who] ? t.who : "") === k).length}</b></div>`).join("");

  renderPhotos();
}

function renderPhotos() {
  const el = $("#w-photos");
  const photos = allPhotos();
  const canAdd = !!assets && !!db && state.canWrite;
  const canStyle = !!db && state.canWrite;
  if (state.photoIndex >= photos.length) state.photoIndex = 0;
  const p = photos[state.photoIndex];

        <div class="photo-dots">${photos.map((_, i) => `<button data-action="photo" data-id="${i}" aria-label="Photo ${i + 1} of ${photos.length}" aria-current="${i === state.photoIndex}"></button>`).join("")}</div>
        ${tools}
      </div>
    </div>`;
}

/* ===================== render ===================== */

// Live snapshots re-render the page often. Keep half-typed drafts and the focused field intact across them.
function captureFields() {
  const drafts = [];
  document.querySelectorAll("#main form[data-form] [id]").forEach((el) => {
    if (el.matches("input:not([type=hidden]),select,textarea")) drafts.push([el.id, el.value]);
  });
  const a = document.activeElement;
  let focus = null;
  if (a && a.id && $("#main").contains(a) && a.matches("input,select,textarea")) {
    focus = { id: a.id, value: a.value, start: null, end: null };
    try { focus.start = a.selectionStart; focus.end = a.selectionEnd; } catch (e) {}
  }
  return { drafts, focus };
}

function restoreFields({ drafts, focus }) {
  drafts.forEach(([id, value]) => { const el = document.getElementById(id); if (el) el.value = value; });
  if (!focus) return;
  const el = document.getElementById(focus.id);
  if (!el) return;
  if (!el.closest("form")) el.value = focus.value;   // inline note / paid / total being typed
  el.focus({ preventScroll: true });
  try { if (focus.start != null) el.setSelectionRange(focus.start, focus.end); } catch (e) {}
}

function render() {
  const fields = captureFields();
  hideTooltip();
  renderTabs();
  renderSub();
  const views = { home: homeView, budget: budgetView, people: peopleView, inbox: inboxView, dashboard: dashboardView };
  $("#main").innerHTML = views[state.tab] ? views[state.tab]() : eventView(state.tab);
  const wide = state.tab === "dashboard";
  $("#page").classList.toggle("wide", wide);
  $("#side").hidden = wide;
  if (!wide) renderSide();
  restoreFields(fields);
  if (wide && animateDash) { animateDash = false; runDashAnimations(); }
}

function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button class="app-tab" data-action="tab" data-id="${k}"${state.tab === k ? ' aria-current="page"' : ""}>${l}</button>`).join("");
}

function renderSub() {
  const today = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  let context = "";
  if (state.tab === "home") {
    const e = daysUntil(EVENTS.elopement.date), r = daysUntil(EVENTS.reception.date);
    context = e >= 0 ? `${plural(e, "day")} to the redwoods · ${r} to The Betty` : r >= 0 ? `${plural(r, "day")} to The Betty` : "";
  } else if (EVENTS[state.tab]) {
    context = fmtDay(EVENTS[state.tab].date, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  }
  const chips = ["xavier", "rachel"].map((k) => `<button class="chip" data-action="me" data-id="${k}" aria-pressed="${state.me === k}">${PEOPLE[k].name}</button>`).join("");
  $("#hero-sub").innerHTML = `<span>${today}</span>${context ? `<span>${context}</span>` : ""}<span class="viewing" id="viewing" role="group" aria-label="Who's using this">I'm ${chips}</span>`;
}

function setGreeting(fade) {
  const list = GREETINGS[state.tab] || GREETINGS.home;
  const last = setGreeting.last || {};
  let i;
  do { i = Math.floor(Math.random() * list.length); } while (list.length > 1 && i === last[state.tab]);
  last[state.tab] = i; setGreeting.last = last;
  const html = list[i].replace("{name}", viewerName()).replace("{part}", partOfDay());
  const g = $("#greeting");
  if (!fade || REDUCED_MOTION) { g.innerHTML = html; return; }
  g.style.opacity = "0";
  setTimeout(() => { g.innerHTML = html; g.style.opacity = "1"; }, 260);
}

function setTab(tab, { scroll = true } = {}) {
  if (!TABS.some(([k]) => k === tab)) tab = "home";
  const changed = tab !== state.tab;
  state.tab = tab; state.editing = ""; state.drill = null;
  if (tab === "dashboard") animateDash = true;
  try { history.replaceState(null, "", "#" + tab); } catch (e) {}
  if (changed) setGreeting(true);
  render();
  if (scroll) scrollTo({ top: 0 });
}

/* ---------- dashboard motion ---------- */

function runDashAnimations() {
  if (REDUCED_MOTION) return;
  const segs = document.querySelectorAll(".dseg"), bars = document.querySelectorAll(".hbar");
  segs.forEach((el) => { el.style.transition = "none"; el.style.strokeDasharray = `0 ${el.dataset.circ}`; });
  bars.forEach((el) => { el.style.transition = "none"; el.style.transform = "scaleX(0)"; });
  void document.body.offsetWidth;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    segs.forEach((el) => { el.style.transition = ""; el.style.strokeDasharray = ""; });
    bars.forEach((el) => { el.style.transition = ""; el.style.transform = ""; });
  }));
}

/* ---------- tooltip ---------- */

const tooltip = $("#tooltip");
function hideTooltip() { tooltip.hidden = true; }
document.addEventListener("pointerover", (e) => {
  const el = e.target.closest && e.target.closest("[data-tip-name]");
  if (!el) return;
  $("#tt-title").textContent = el.dataset.tipName;
  $("#tt-body").innerHTML = `<span class="tt-dot" style="background:${el.dataset.tipColor}"></span><span class="tt-val">${esc(el.dataset.tipVal)}</span>${el.dataset.tipPct !== "" ? `<span class="tt-pct">${esc(el.dataset.tipPct)}%</span>` : ""}`;
  tooltip.hidden = false;
});
document.addEventListener("pointerout", (e) => { if (e.target.closest && e.target.closest("[data-tip-name]")) hideTooltip(); });
document.addEventListener("pointermove", (e) => {
  if (tooltip.hidden) return;
  let x = e.clientX + 16, y = e.clientY - 12;
  if (x + 190 > innerWidth) x = e.clientX - 196;
  tooltip.style.left = x + "px"; tooltip.style.top = y + "px";
}, { passive: true });

/* ---------- liquid glass edge glow (follows the cursor) ---------- */

let glowEl = null;
document.addEventListener("pointermove", (e) => {
  if (e.pointerType && e.pointerType !== "mouse") return;
  const el = e.target.closest ? e.target.closest(".glass,.kpi,.app-tab") : null;
  if (glowEl && glowEl !== el) { glowEl.classList.remove("glow"); }
  glowEl = el;
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--mx", (((e.clientX - r.left) / r.width) * 100).toFixed(1) + "%");
  el.style.setProperty("--my", (((e.clientY - r.top) / r.height) * 100).toFixed(1) + "%");
  el.classList.add("glow");
}, { passive: true });
document.addEventListener("pointerleave", () => { if (glowEl) glowEl.classList.remove("glow"); glowEl = null; });

/* ---------- toast ---------- */

let toastTimer = 0;
function toast(msg, { bad = false, undo = null } = {}) {
  const t = $("#toast");
  clearTimeout(toastTimer);
  t.className = bad ? "bad" : "";
  t.innerHTML = `<span class="dot"></span><span class="msg"></span>${undo ? '<button type="button">Undo</button>' : ""}`;
  t.querySelector(".msg").textContent = msg;
  if (undo) t.querySelector("button").onclick = () => { t.hidden = true; undo(); };
  t.hidden = false;
  toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 6000 : 3200);
}

/* ===================== writes ===================== */

function writeError(e) {
  switch (e && e.code) {
    case "invalid_argument": return "That change wasn't allowed. If you were invited as a viewer, ask for Editor access.";
    case "quota_exceeded": return "The planner is full. Delete a few old items and try again.";
    case "resource_exhausted": return "Lots of changes at once. Wait a moment and try again.";
    case "revoked": return "Your access to this page changed. Reload to continue.";
    default: return "Couldn't save. Check your connection and try again.";
  }
}

async function save(promise, okMsg) {
  try { await promise; if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (e && e.code === "invalid_argument" && state.writeUnknown) { state.canWrite = false; state.writeUnknown = false; render(); }
    toast(writeError(e), { bad: true });
    return false;
  }
}

function canWriteNow() {
  if (!db) { toast("Open this page in Claude to save changes.", { bad: true }); return false; }
  if (state.canWrite === false) { toast("You can view this plan but not change it.", { bad: true }); return false; }
  return true;
}

const COLLECTION_LABEL = { tasks: "Task", budget: "Budget item", people: "Person" };
const STATE_KEY = { tasks: "tasks", budget: "budget", people: "people" };

async function removeDoc(kind, id) {
  if (!canWriteNow() || !STATE_KEY[kind]) return;
  const row = state[STATE_KEY[kind]].find((r) => r.id === id);
  if (!row) return;
  const { id: _omit, ...copy } = row;
  const ref = db.collection(kind).doc(id);
  if (await save(ref.delete())) {
    toast(`${COLLECTION_LABEL[kind]} deleted`, { undo: () => save(ref.set(copy), "Restored") });
  }
}

function toggleTask(id) {
  if (!canWriteNow()) return;
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  if (!t.done && !PEOPLE[state.me]) {
    toast("Tap Xavier or Rachel at the top first, so the plan knows who finished it.");
    const v = $("#viewing"); if (v) { v.classList.remove("nudge"); void v.offsetWidth; v.classList.add("nudge"); }
    return;
  }
  save(db.collection("tasks").doc(id).update(t.done ? { done: false, doneBy: "", doneAt: 0 } : { done: true, doneBy: state.me, doneAt: Date.now() }));
}

function setMe(who) {
  state.me = who;
  try { localStorage.setItem("wedding-hq:me", who); } catch (e) {}
  if (db && uid) db.doc(`data/users/${uid}/profile`).set({ who }).catch(() => {});
  setGreeting(true);
  render();
}

async function copyText(btn) {
  const value = btn.dataset.copy;
  try { await navigator.clipboard.writeText(value); toast("Copied " + value); }
  catch (e) {
    const span = btn.previousElementSibling;
    if (span) { const r = document.createRange(); r.selectNodeContents(span); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("Selected. Press Ctrl+C or ⌘C to copy.");
  }
}

/* ---------- photos ---------- */

function downscale(file, maxEdge = 2400) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("encode"))), "image/jpeg", 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}

function uploadError(e) {
  switch (e && e.code) {
    case "too_large": return "That photo is too big. Try a smaller copy.";
    case "unsupported_type": return "That file type isn't supported. Use a JPEG or PNG.";
    case "quota_or_state": return "Photo storage is full. Remove a photo and try again.";
    case "rate_limited": return "Too many uploads at once. Wait a moment, then try again.";
    case "upstream_auth": return "Your sign-in expired. Reload the page and try again.";
    default: return "Couldn't upload that photo. Try again.";
  }
}

async function addPhotos(files) {
  if (!canWriteNow() || !assets) return;
  let added = 0;
  for (const file of files) {
    let blob;
    try { blob = await downscale(file); }
    catch (e) { toast(`Couldn't read ${file.name}. Try saving it as a JPEG first.`, { bad: true }); continue; }
    try {
      const up = await assets.upload(blob, { type: "image/jpeg" });
      const ok = await save(db.collection("photos").add({ asset: up.id, caption: "", addedBy: state.me || "", addedAt: Date.now() }));
      if (ok) added++;
    } catch (e) { toast(uploadError(e), { bad: true }); }
  }
  if (added) toast(added === 1 ? "Photo added" : `${added} photos added`);
}

async function deletePhoto(id) {
  if (!canWriteNow()) return;
  const p = state.photos.find((x) => x.id === id);
  if (!p) return;
  const updates = [];
  if (state.settings.background === p.asset) updates.push(db.doc("settings/main").set({ ...state.settings, background: "" }));
  if (!(await save(Promise.all([...updates, db.collection("photos").doc(id).delete()]), "Photo removed"))) return;
  if (assets) assets.delete(p.asset).catch(() => {});
}

function setBackground(key) {
  if (!canWriteNow()) return;
  const next = state.settings.background === key ? "" : key;
  save(db.doc("settings/main").set({ ...state.settings, background: next }), next ? "Background updated" : "Back to the redwoods");
}

function applyBackground() {
  const chosen = allPhotos().find((p) => p.key && p.key === state.settings.background);
  $("#scene").style.backgroundImage = chosen ? `var(--scrim), url("${chosen.src}")` : "";
}

/* ---------- Gmail ---------- */

function watchMail(force) {
  if (!mcp) { state.mail = { status: "off", threads: [], code: "", storedAt: 0 }; return; }
  const emails = [...new Set(state.people.map((p) => String(p.email || "").trim().toLowerCase()).filter((e) => /^[^\s()"<>]+@[^\s()"<>]+\.[a-z]{2,}$/i.test(e)))].sort();
  const query = emails.length ? `(${emails.map((e) => "from:" + e).join(" OR ")}) newer_than:60d` : "";
  if (query === mailQuery && !force) return;
  mailQuery = query;
  if (mailUnwatch) { mailUnwatch(); mailUnwatch = null; }
  if (!query) { state.mail = { status: "no-contacts", threads: [], code: "", storedAt: 0 }; return; }
  state.mail = { ...state.mail, status: "loading" };
  mailInput = { query, pageSize: 25 };
  mailUnwatch = mcp.watchTool("Gmail", "search_threads", mailInput, (ev) => {
    if (ev.type === "data") applyMail(ev.result);
    else {
      const code = (ev.error && ev.error.code) || "upstream_error";
      state.mail = { ...state.mail, status: "error", code, threads: MAIL_RETRACT.has(code) ? [] : state.mail.threads };
    }
    render();
  }, { refetchInterval: 300000 });
}

function applyMail(result) {
  const p = result && result.payload;
  const latest = (th) => { const m = th.messages || []; return Date.parse((m[m.length - 1] || {}).date || "") || 0; };
  const threads = p && Array.isArray(p.threads) ? [...p.threads].sort((a, b) => latest(b) - latest(a)) : [];
  state.mail = { status: "ok", threads, code: "", storedAt: (result.cache && result.cache.storedAt) || Date.now() };
}

async function allowGmail() {
  if (!mcp || !mailInput) return;
  try { applyMail(await mcp.callTool("Gmail", "search_threads", mailInput)); }
  catch (e) { state.mail = { ...state.mail, status: "error", code: (e && e.code) || "upstream_error" }; }
  render();
}

function refreshMail() {
  if (!mcp) return;
  state.mail = { ...state.mail, status: "loading" };
  render();
  mcp.invalidate("Gmail", "search_threads").catch(() => watchMail(true));
}

/* ===================== events ===================== */

document.addEventListener("click", (e) => {
  const drill = e.target.closest && e.target.closest("[data-drill-type]");
  if (drill) {
    state.drill = { type: drill.dataset.drillType, key: drill.dataset.drillKey };
    render();
    const d = $("#drill"); if (d) d.scrollIntoView({ behavior: REDUCED_MOTION ? "auto" : "smooth", block: "nearest" });
    return;
  }
  const b = e.target.closest && e.target.closest("[data-action]");
  if (!b) return;
  const { action, id, kind } = b.dataset;
  switch (action) {
    case "tab": setTab(id); break;
    case "filter": state.filter = id; render(); break;
    case "me": setMe(id); break;
    case "toggle": toggleTask(id); break;
    case "delete": removeDoc(kind, id); break;
    case "edit": {
      state.editing = id; render();
      const f = $("#main form[data-form^='edit'] input"); if (f) f.focus();
      break;
    }
    case "cancel": state.editing = ""; render(); break;
    case "copy": copyText(b); break;
    case "refresh-mail": refreshMail(); break;
    case "allow-gmail": allowGmail(); break;
    case "close-drill": state.drill = null; render(); break;
    case "add-photos": if (canWriteNow()) $("#photo-input").click(); break;
    case "photo": state.photoIndex = Number(id) || 0; renderPhotos(); break;
    case "set-bg": setBackground(id); break;
    case "delete-photo": deletePhoto(id); break;
  }
});

$("#photo-input").addEventListener("change", (e) => {
  const files = [...e.target.files]; e.target.value = "";
  if (files.length) addPhotos(files);
});

document.addEventListener("change", (e) => {
  const el = e.target, kind = el.dataset && el.dataset.change;
  if (!kind) return;
  if (el.tagName === "SELECT") el.blur();
  if (!canWriteNow()) { render(); return; }
  const id = el.dataset.id;
  const num = (v) => Math.max(0, Number(v) || 0);
  switch (kind) {
    case "task-who": save(db.collection("tasks").doc(id).update({ who: el.value })); break;
    case "person-status": save(db.collection("people").doc(id).update({ status: el.value })); break;
    case "person-note": save(db.collection("people").doc(id).update({ note: el.value.trim() })); break;
    case "item-paid": {
      const item = state.budget.find((i) => i.id === id);
      if (item && num(el.value) !== (Number(item.paid) || 0)) save(db.collection("budget").doc(id).update({ paid: num(el.value) }));
      break;
    }
    case "budget-total": {
      if (num(el.value) !== (Number(state.settings.budget) || 0)) save(db.doc("settings/main").set({ ...state.settings, budget: num(el.value) }), "Total budget saved");
      break;
    }
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches && e.target.matches("input[data-change]")) e.target.blur();
});

document.addEventListener("submit", async (e) => {
  const f = e.target.closest && e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  if (!canWriteNow()) return;
  const d = Object.fromEntries(new FormData(f));
  const str = (v) => String(v ?? "").trim();
  const num = (v) => Math.max(0, Number(v) || 0);
  const part = PARTS[d.part] ? d.part : "general";
  const kind = f.dataset.form, id = f.dataset.id;
  const firstFieldId = (f.querySelector("input:not([type=hidden])") || {}).id;
  let ok = false;
  switch (kind) {
    case "add-task":
      if (!str(d.title)) return;
      ok = await save(db.collection("tasks").add({ title: str(d.title), who: PEOPLE[d.who] ? d.who : "", part, due: d.due || "", done: false, doneBy: "", doneAt: 0, createdAt: Date.now() }), "Task added");
      break;
    case "add-person":
      if (!str(d.name)) return;
      ok = await save(db.collection("people").add({ name: str(d.name), role: str(d.role), email: str(d.email), phone: str(d.phone), part, status: "Researching", note: "" }), "Added " + str(d.name));
      break;
    case "add-item":
      if (!str(d.name)) return;
      ok = await save(db.collection("budget").add({ name: str(d.name), planned: num(d.planned), paid: 0, part, note: str(d.note) }), "Budget item added");
      break;
    case "edit-task":
      ok = await save(db.collection("tasks").doc(id).update({ title: str(d.title), part, due: d.due || "" }), "Saved");
      break;
    case "edit-person":
      ok = await save(db.collection("people").doc(id).update({ name: str(d.name), role: str(d.role), email: str(d.email), phone: str(d.phone), part }), "Saved");
      break;
    case "edit-item":
      ok = await save(db.collection("budget").doc(id).update({ name: str(d.name), planned: num(d.planned), part, note: str(d.note) }), "Saved");
      break;
  }
  if (!ok) return;
  if (kind.startsWith("add")) {
    // a snapshot may have re-rendered the form while the write was in flight, so reset the live one
    const first = firstFieldId && document.getElementById(firstFieldId);
    const live = first ? first.form : f;
    const keepFocus = live.contains(document.activeElement);
    live.reset();
    if (first && keepFocus) first.focus({ preventScroll: true });
  } else {
    state.editing = "";
    if (document.activeElement) document.activeElement.blur();
  }
  render();
});
