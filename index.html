  ticking = false;
}
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

/* ---------- sidebar widgets take turns at the top ---------- */

let cycleTimer = 0;
function cycleWidgets() {
  const side = $("#side");
  if (side.hidden || side.contains(document.activeElement)) return;
  const items = [...side.children].filter((el) => !el.hidden);
  if (items.length < 2) return;
  const [top, ...rest] = items;
  const before = rest.map((el) => el.getBoundingClientRect().top);
  const topStart = top.offsetTop;
  Object.assign(top.style, { position: "absolute", left: "0", right: "0", top: topStart + "px", zIndex: "-1", transition: "none" });
  side.appendChild(top);
  rest.forEach((el, i) => { el.style.transition = "none"; el.style.transform = `translateY(${before[i] - el.getBoundingClientRect().top}px)`; });
  const last = rest[rest.length - 1];
  const finalTop = last.offsetTop + last.offsetHeight + 10;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    top.style.transition = "transform .22s ease, opacity .22s ease";
    top.style.transform = "translateY(-40px) scale(.92)"; top.style.opacity = "0";
    rest.forEach((el) => { el.style.transition = "transform .5s cubic-bezier(.4,0,.2,1)"; el.style.transform = ""; });
  }));
  setTimeout(() => {
    top.style.transition = "none"; top.style.top = finalTop + "px"; top.style.transform = "translateY(16px) scale(.92)";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      top.style.transition = "transform .32s cubic-bezier(.34,1.15,.64,1), opacity .32s ease";
      top.style.transform = ""; top.style.opacity = "1";
      setTimeout(() => { ["position", "left", "right", "top", "zIndex", "transform", "transition", "opacity"].forEach((p) => (top.style[p] = "")); rest.forEach((el) => (el.style.transition = "")); }, 340);
    }));
  }, 240);
}
function startCycle() {
  if (REDUCED_MOTION || cycleTimer || !matchMedia("(min-width: 861px)").matches) return;
  cycleTimer = setInterval(() => { if (!document.hidden) cycleWidgets(); }, 8000);
}
function stopCycle() { clearInterval(cycleTimer); cycleTimer = 0; }
$("#side").addEventListener("mouseenter", stopCycle);
$("#side").addEventListener("mouseleave", startCycle);

// photos rotate on their own, slower than the widgets
setInterval(() => {
  if (document.hidden || $("#side").hidden || $("#w-photos").matches(":hover")) return;
  state.photoIndex = (state.photoIndex + 1) % allPhotos().length;
  renderPhotos();
}, 9000);

/* ===================== boot ===================== */

const use = (name) => (window.claude && window.claude.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null));

function subscribe(path, key, { sort } = {}) {
  db.collection(path).onSnapshot((snap) => {
    let rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (sort) rows = rows.sort(sort);
    state[key] = rows;
    markLoaded(key);
    if (key === "people") watchMail();
    if (key === "photos") applyBackground();
    render();
  }, onSyncError);
}

function markLoaded(key) {
  const wasLoading = state.status === "loading";
  state.loaded.add(key);
  if (wasLoading && ["tasks", "budget", "people"].every((k) => state.loaded.has(k))) {
    state.status = "live";
    if (state.tab === "dashboard") animateDash = true;
  }
}

function onSyncError(e) {
  if (e && e.code === "revoked") { state.status = "offline"; render(); return; }
  toast("Lost the live connection. Reload the page to reconnect.", { bad: true });
}

async function boot() {
  const hash = location.hash.slice(1);
  if (TABS.some(([k]) => k === hash)) state.tab = hash;
  setGreeting(false);
  render();
  onScroll();
  startCycle();

  const [dbNs, mcpNs, userNs, assetsNs] = await Promise.all([use("db"), use("mcp"), use("user"), use("assets")]);
  db = dbNs; mcp = mcpNs; assets = assetsNs;
  if (!db) { state.status = "offline"; watchMail(); render(); return; }

  // can() answers null when the platform hasn't said; keep the controls and let a refused write decide
  let can = null;
  if (userNs) {
    try { can = await userNs.can("data.write"); } catch (e) { can = null; }
    try { uid = await userNs.id(); } catch (e) { uid = null; }
  }
  state.canWrite = can !== false;
  state.writeUnknown = can === null;

  if (uid) {
    db.doc(`data/users/${uid}/profile`).onSnapshot((snap) => {
      const who = snap.exists ? snap.data().who : "";
      if (PEOPLE[who] && who !== state.me) {
        state.me = who;
        try { localStorage.setItem("wedding-hq:me", who); } catch (e) {}
        setGreeting(false); render();
      } else if (!snap.exists && PEOPLE[state.me]) {
        db.doc(`data/users/${uid}/profile`).set({ who: state.me }).catch(() => {});
      }
    }, () => {});
  }

  subscribe("tasks", "tasks");
  subscribe("budget", "budget");
  subscribe("people", "people", { sort: (a, b) => String(a.name).localeCompare(String(b.name)) });
  subscribe("photos", "photos", { sort: (a, b) => (a.addedAt || 0) - (b.addedAt || 0) });
  db.doc("settings/main").onSnapshot((snap) => {
    state.settings = snap.exists ? { ...snap.data() } : {};
    applyBackground();
    render();
  }, onSyncError);
  watchMail();
  render();
}

boot();
</script>
